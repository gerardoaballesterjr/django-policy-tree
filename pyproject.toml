[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "django-policy-tree"
version = "0.1.0"
description = "Domain-agnostic, tree-based permissions for Django and DRF, with policies superusers edit in the admin."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Gerardo Ballester Jr." }]
dependencies = ["Django>=4.2"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Topic :: Security",
    "Framework :: Django",
    "Framework :: Django :: 4.2",
    "Framework :: Django :: 5.2",
    "Framework :: Django :: 6.0",
    "Framework :: Django :: 6.1",
    "Programming Language :: Python :: 3",
]

[project.optional-dependencies]
drf = ["djangorestframework>=3.14"]
test = ["djangorestframework>=3.14", "pytest>=8", "pytest-django>=4.8", "hypothesis>=6.100", "pytest-cov>=5"]
docs = ["mkdocs>=1.6,<2", "mkdocs-material>=9.5,<10"]
postgres = ["psycopg[binary]>=3.1"]
mysql = ["mysqlclient>=2.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
policytree = ["migrations/*.py"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
pythonpath = ["src", "."]
testpaths = ["tests"]
